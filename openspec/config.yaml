schema: spec-driven

context: |
  本项目是面向学术论文文本的 AI 痕迹检测与降重改写工具，在保持原意与学术规范的前提下降低论文 AI 生成率检测结果。。

  工作区与上下文：
  - 工作区布局见 .ai-sdd/context/sdd/工作区布局（workspace-layout）.md。
  - 上下文入口见 .ai-sdd/context/context-index.yaml。
  - 上下文可信度、冲突处理和最小加载原则见 .ai-sdd/context/sdd/上下文治理规则（context-governance）.md。

  scope 判定：
  - 后端 Java/DB → backend
  - PC 前端（ai-rate-reducer）→ frontend-pc
  - 共享组件库（可被多仓库直接引用，无远程调用） → components
  - 多端/多仓库/fullstack 单仓多层 → 同时使用对应 scope
  - 无法判断 → all
  - scope: all 只表示适用于所有 scope，不表示始终加载

  后端仓库（backend scope）包含：ai-rate-reducer。
  （fullstack 全栈仓库同时出现在 backend scope 和对应的 frontend scope 中；
   虽然代码在同一 repo，但各服务组件仍独立部署，center 间调用仍遵循 CSF 原则）
  （components 共享组件库为独立 scope，通过构建期依赖被消费方直接引用，不经 CSF/HTTP）

  上下文加载：
  - 先读 context-index.yaml 和 load_policy: always 条目。
  - 阶段开始读取匹配 stage/scope 的 stage-start 条目。
  - 当前问题、候选探索或事实查证命中时读取 on-demand 条目；目录型上下文只先读 README/索引，再按候选或证据需求读取具体文件。
  - 阶段产物完成后读取匹配 stage/scope 的 stage-end checklist 自检。

  全局原则：
  - 工作流程：proposal → specs → design → tasks → apply → verify → archive。
  - 当前 change 专属上下文只在处理同名 change 时加载：.ai-sdd/context/changes/{change-name}/README.md。
  - 功能判断优先级：复用已有能力 > 修改已有流程 > 新增能力。
  - 不确定的数据归属、规则优先级、异常处理、接口能力必须显式列为 TODO: 待确认，不得擅自假设。

  证据与接口查询：
  - 凡涉及复用已有 API / 服务方法 / Controller / RPC 接口，必须先确认签名与契约。
  - 优先调用 API Registry：先 search_api_meta 用业务关键词发现 top-5 候选，再 search_api_detail 拉取目标详情；初次未命中时换同义词、上位词、表名或字段名重试 1-2 轮。
  - API Registry 未覆盖时，按需查阅 .ai-sdd/context/system/api-drilldown/：先读总 README 和层级 README 发现候选，只对候选接口读取方法级文档。
  - 仍不足时使用 GitNexus：query 按概念查调用链，context 按符号名查契约和上下文。
  - 禁止推导或编造未经证据确认的接口签名、参数、返回值、字段、枚举、配置、组件 ID、路由和代码行为。
  - 经查询确认需要新增接口时，必须在 design/tasks/code 中明确标注“新增接口”，并实现完整逻辑，禁止 TODO 占位。

rules:
  proposal:
    - 按 context-index 的 proposal + 当前 scope 最小加载上下文。
    - 如涉及现有流程，必须比较 AS-IS 与 TO-BE 差异。
    - 关键信息不足时，先输出待确认问题，再继续生成 proposal。
    - 完成后读取 sdd/需求提案检查清单（proposal-checklist）.md 自检，不合格项先修正。

  specs:
    - 按 context-index 的 specs + 当前 scope 最小加载上下文。
    - 按系统或模块拆分需求，每个 spec 对应一个独立能力。
    - 只描述系统应具备的行为，不写代码实现细节。
    - 引用既有业务规则与术语，不自行发明业务概念。
    - 例外场景必须在 specs 中有对应行为要求。
    - 完成后读取 sdd/需求规格检查清单（specs-checklist）.md 自检，不合格项先修正。

  design:
    - 按 context-index 的 design + 当前 scope 最小加载上下文。
    - 必须遵循全局“证据与接口查询”规则；未经证据确认的接口签名、字段、枚举、配置、组件 ID 不得写成确定结论。
    - 涉及 OUTBOUND 调用（对当前仓库不可控的外部协议：第三方 HTTP/PIP/SDK/MQ bridge/ESB/网关代发等任一形式）时，design.md 必须显式声明"内部字段名 ↔ 外部协议 body 字段名"映射表（保留外部协议原大小写/拼写）与"由内层 X 补齐"责任划分；contracts.md 同章节固化。
    - 前后端交互必须同时考虑前端能力、后端能力和接口契约；若提供 UI 原型，前端设计须对照原型，后端设计须满足前端需求。
    - 前端通过页面网关调用 PSV/BFF 的 CSF 服务接口；PSV 聚合调用 BSV；BSV 以 CSF SV 接口暴露业务能力。优先复用或修改现有 CSF 接口，禁止轻易新增 CSF 服务。
    - 涉及界面交互时，参考以下前端仓库（按仓库名取其 README / docs / 现有 UI 代码模式为准；不要凭空捏造组件库、目录或规范）：ai-rate-reducer（论文 AI 率降低工具）。
    - 涉及数据写入时，必须明确主数据归属和同步边界。
    - 涉及后端业务逻辑时，必须根据数据归属、已有 DAO、已有 BSV/PSV 接口和系统模块职责确认实施 center；禁止在不拥有目标数据表或核心能力的 center 中新增 DAO 或核心业务逻辑；跨中心访问应通过已有接口、adapter 或网关调用完成。
    - "design.md 涉及后端业务时必须包含“后端中心归属决策”，列出数据域、目标表/DAO、实施中心、判断依据和跨中心调用路径；无法确认则标 TODO: 待确认。"
    - 涉及订单完工、受理完工、长流程、跨中心补偿或后台处理时，必须输出“同步/异步处理决策”；无法判断则标待确认。
    - 选择异步处理时，只设计业务处理组件，不设计或改造 ET 后台调度框架。异步业务组件设计包含组件名称、职责边界、输入参数来源、幂等键、主处理步骤、成功状态回写、失败状态回写、可重试/不可重试异常分类，以及“由人类将组件配置到 ET 后台调度”的任务提示。
    - 必须在 design.md 末尾列出本次 change 可复用的接口方法，按 BSV / PSV 分组，作为编码前检查项。
    - 涉及数据库变更（新增表/字段/索引）时，设计阶段须给出 DDL 草案，并遵循数据库设计规范。
    - 前端设计须标明涉及页面、组件、路由，并确认与后端接口出入参匹配。
    - 凡需同时记录“当前状态/管控记录”和“操作日志/变更历史”的需求，必须设计两张独立物理表，禁止混在同一张表。
    - 涉及在已有业务规则方法、公共校验类、共享 SV/Service 等大文件注入逻辑时，必须精确给出文件路径、方法名（含签名）、注入位置和失败处理策略。
    - design.md mermaid 流程图中的每个调用/系统动作节点，必须在对应层次的文字描述表或编排步骤中有对等条目；禁止流程图节点在文字描述中静默省略。
    - design 与 specs 在行为/契约/交互方式上若存在不一致，必须在 design.md 的 Decisions 表中显式记录偏离决策（D-* ID / specs 原始定义 / design 修正值 / 修正依据）；不允许静默覆盖 specs 定义。
    - 完成后读取 sdd/系统设计检查清单（design-checklist）.md 自检，不合格项先修正。

  tasks:
    - 按 context-index 的 tasks + 当前 scope 最小加载上下文。
    - 涉及接口复用、新增接口、枚举、字段契约、组件 ID 或路由时，必须遵循全局“证据与接口查询”规则，并在任务中保留证据来源或待确认项。
    - 每个任务对应明确修改点或交付物，禁止“研究一下”“看看怎么做”“特殊处理”等模糊任务。
    - 后端任务按分层模板拆分：BSV（ai-rate-reducer）为 Phase 1 DDL/DML → Phase 2 BO/IValues → Phase 3 DAO → Phase 4 BSV-ServiceImpl → Phase 4-Task ET（仅异步）→ Phase 5 BSV-CSF/adapter；PSV（ai-rate-reducer）为 Phase 6 PSV-ServiceImpl → Phase 7 PSV-CSF/adapter。
    - 每个后端任务必须标注实施仓库/center；fullstack 仓库标注格式为 `repo-name[PSV]` 或 `repo-name[BSV]`；涉及多中心协作时写清调用链（同仓 fullstack 的 PSV→BSV 仍走 CSF）。
    - 涉及 DDL 时，必须产出 .sql 文件到 project-profile.yaml 的 paths.ddl_directory；执行 SQL 前必须征询用户同意，未获同意时仅允许输出执行计划与命令预览。
    - 涉及 DDL/SQL 执行配置时，读取 paths.db_config_location 下配置说明或示例；不得生成真实 DB 配置模板，不得写入真实密码、token 或生产连接串。
    - 前端任务按功能模块拆分（路由/页面/组件/API 调用），无需后端分层。
    - 测试任务必须覆盖主流程、规则校验、异常路径、合规校验。
    - 涉及前端页面/组件/路由/API 改动时，必须先补充 E2E 用例清单规范；字段至少包含 ID、用例名称、所属产品、所属模块、用例等级、用例类型、前提条件、用例步骤、预期结果、关联需求、自动化覆盖、是否 UI 用例、是否冒烟用例、创建/更新时间等。
    - E2E 用例清单与脚本草稿默认落盘到 paths.e2e_directory，不按 {repo} 分目录，不写死到前端仓库 docs/testing/e2e/。
    - 默认只生成 E2E 规范与模板，不自动新增 E2E 测试任务，不自动生成 E2E 测试脚本，除非用户明确要求。
    - OpenSpec 生成的测试源码默认落盘到 paths.test_source_directory，按 {repo} 区分；只有任务明确要求沉淀为长期回归测试，才写入目标仓库原生测试目录，并在 tasks 中标注迁移原因和人工确认点。
    - 仓库级单测/Mock 用例清单、人工验证清单默认落盘到 paths.test_cases_directory；测试数据落到 paths.test_data_directory；runner 落到 paths.test_runner_directory；测试报告落到 paths.test_report_directory，并按 {repo} 分目录。
    - 涉及新增/修改 BSV 对外接口层时，Phase 5 后追加 Phase 5.T-A Mock 单元测试任务；涉及新增/修改 PSV 对外接口层时，Phase 7 后追加 Phase 7.T-A Mock 单元测试任务。集成冒烟测试 T-B 当前未配置，不生成 T-B 任务。
    - 若新增或修改 PSV 对前端暴露接口，追加“配置任务：页面网关配置”，只提示人类完成 serviceCode/API 映射配置。
    - 若新增或修改 BSV 对外接口，追加“配置任务：BSV/CSF 服务配置”，只提示人类完成 API 网关或 CSF 服务配置。
    - 若 design 判定为异步处理，追加“配置任务：ET 后台调度组件配置”，只提示人类配置并通过构造测试任务验证可调起。
    - 页面网关、BSV/CSF、ET 后台调度等人工配置任务只提示人类完成；AI 不生成配置 SQL 或配置模板。
    - 超大文件修改任务必须精确到目标方法签名、注入位置、失败处理策略和禁止全文读取提示。
    - 生成 tasks 后，使用技能 ai-pre-code-review 或等价的真实代码结构调研做一次代码现实校准；发现偏差后修正 artifacts。
    - 完成后读取 sdd/开发任务分解清单（task-checklist）.md 自检，不合格项先修正。

  apply:
    - 按 context-index 的 apply + 当前 scope 最小加载上下文。
    - 涉及接口复用、新增接口、枚举、字段契约、组件 ID 或路由时，必须遵循全局“证据与接口查询”规则；编码前先确认契约，不得凭推导实现。
    - 实现 OUTBOUND 出站 body 组装或 SDK 调用前，必须先比对外部协议文档（位于 api-catalog/api-drilldown/API Registry 或 change 专属 README）的字段名、必填项、字段类型；若 design.md 或 contracts.md 缺少 OUTBOUND 字段映射、"由内层 X 补齐"责任层，或发现与外部协议不符的必填缺失/大小写错误，立即暂停并要求回到 design/contracts 修正后再编码；不得默认用任何"自动转大写/自动重命名"等副作用方法替代显式 key 映射。
    - 只实现代码任务和测试任务，不自动执行页面网关、BSV/CSF、ET 后台调度等人工配置；完成后提示用户配置并说明联调验证方式。
    - 严格遵循 design.md、tasks.md、编码规范和命中的 code-pattern；偏离必须记录并评审。
    - 代码模式优先：依据已命中的 code-pattern 自主实现，不机械复制；若样板不足，使用 GitNexus 调研真实代码确认框架调用模式。
    - 不编造枚举值；需要状态码、类型码、场景码时读取枚举字典或源码/API 证据。
    - 无法获知接口类型、字段、方法契约时，使用 GitNexus 或源码确认，不推导。
    - 禁止跨微服务中心直接 import 对方业务代码包；跨中心协作只能通过 CSF 层调用，或按 design 明确的数据层互访路径实现。
    - SV 层访问数据必须通过 DAO/BO（或等价 Repository）完成，禁止在 SV/CSF 层直接写 SQL、直接 JDBC 访问或绕过 DAO 访问 Engine。
    - 所有 import（或等价依赖引入）必须位于文件头；禁止在方法/函数体内临时引入，除非框架强制要求且已在注释和 review-notes 说明。
    - 禁止通配符 import（如 `*`）与未使用 import。
    - 尽量减少直接硬编码：业务编码、枚举值、serviceCode、MQ topic/tag、模板 ID、路由键等必须优先落常量或配置；确需硬编码时写入 review-notes 并给出替换计划。
    - 编辑任何现有符号前执行 GitNexus impact；完成后执行 detect_changes 验证范围。
    - 涉及 DDL/SQL 执行时，读取 paths.ddl_directory 下 SQL；执行前征询用户同意；未获同意时仅输出执行计划与命令预览。
    - 记录实现过程中的问题、不确定项和设计偏差到 review-notes 类文件。
    - 代码模式与任务描述冲突时，必须读取真实代码确认冲突性质，根据 design/tasks 决策，并在 review-notes 中记录理由。
    - 编码完成时若 review-notes 中仍有 5 个以上未解决的待确认项或设计偏差，必须暂停并提示用户，不得继续推进下一 Phase。
    - 关键假设必须先读真实代码再编码：目标文件实际方法名、接口/Bean/IValue/DTO 字段与签名、枚举与字典码值、共享工具类签名；优先使用精确行范围读取或 GitNexus context。
    - 每个编码任务完成后读取 sdd/编码实现检查清单（apply-checklist）.md 自检，发现不合格项立即修正。
    - 多 Agent 并行编码只在用户明确启动时使用；规则见 sdd/多Agent并行编码规范（multi-agent-parallel）.md。
